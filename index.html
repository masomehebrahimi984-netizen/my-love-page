
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>یک پیام مخصوص ❤️</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: #100b10;
  color: #ffe5ef;
  font-family: Tahoma, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  text-align: center;
}

.card {
  width: 90%;
  max-width: 430px;
  padding: 38px 23px;
  border: 1px solid #bd7893;
  border-radius: 25px;
  background: linear-gradient(145deg,#21121e,#100b10);
  box-shadow: 0 0 35px #e65b9630;
  position: relative;
  z-index: 2;
}

.crown {
  font-size: 55px;
  margin-bottom: 12px;
  animation: glow 2s infinite alternate;
}

h1 {
  color: #ff91b9;
  font-size: 25px;
  line-height: 1.9;
}

.message {
  font-size: 17px;
  line-height: 2.5;
  margin-top: 22px;
}

.signature {
  color: #ff9fbe;
  font-size: 20px;
  margin-top: 25px;
}

.forever {
  color: #e9c47c;
  direction: ltr;
  font-size: 18px;
  margin-top: 28px;
  letter-spacing: 2px;
}

.heart {
  position: fixed;
  bottom: -30px;
  color: #ff75a8;
  animation: float 7s linear infinite;
  pointer-events: none;
}

@keyframes float {
  to { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
}

@keyframes glow {
  to { text-shadow: 0 0 25px #ff77aa; }
}
</style>
</head>
<body>

<div class="card">
  <div class="crown">👑</div>

  <h1>قلب این آقا قبلاً رزرو شده! ❤️</h1>

  <div class="message">
    سلام دختر خانم! 🙋🏻‍♀️💗<br>
    اگه برای آشنایی با راننده اسکن کردی،
    باید بگم یکم دیر رسیدی! 😌<br>
    این پسر قلبش پیش منه و جایی برای
    کسی دیگه نداره. ❤️
  </div>

  <div class="signature">
    پس با احترام،<br>
    از طرف دوست‌دخترش که خیلی هم دوستش داره! 👑💋
  </div>

  <div class="forever">FOREVER YOURS ❤️</div>
</div>

<script>
function makeHeart() {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.textContent = Math.random() > 0.5 ? "♥" : "💗";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = (14 + Math.random() * 25) + "px";
  heart.style.animationDuration = (5 + Math.random() * 5) + "s";
  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 10000);
}
setInterval(makeHeart, 450);
</script>

</body>
</html>
